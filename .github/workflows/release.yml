name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            args: --win portable --x64
          - name: macOS Apple Silicon and Intel
            os: macos-latest
            platform: macos-arm64-x64
            args: --mac --arm64 --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw new Error('Tag does not match package version')"
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - name: Build applications
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Smoke test packaged application
        run: npm run smoke:packaged
      - name: Verify packages and generate checksums
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-packages.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: CPA-Model-Switcher-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish all platforms
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: CPA-Model-Switcher-*
          path: release
          merge-multiple: true
      - name: Generate combined checksums
        run: node scripts/checksums.cjs
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt --verify-tag --title "CPA Model Switcher $RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
