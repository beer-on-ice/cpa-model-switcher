<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">CPA Model Switcher</title>
  <desc id="desc">Two model-routing tracks crossing around a central switch node.</desc>
  <defs>
    <linearGradient id="plate" x1="128" y1="24" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16223B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="68" y1="96" x2="188" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="68" y1="160" x2="188" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
