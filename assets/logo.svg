  </defs>
  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#plate)" stroke="#1E293B" stroke-width="2"/>
  <path d="M68 96h120" stroke="#1E2C48" stroke-width="12" stroke-linecap="round"/>
