  <path d="M68 160c52 0 68-64 120-64" fill="none" stroke="url(#cyan)" stroke-width="24" stroke-linecap="round"/>
  <path d="M68 96c52 0 68 64 120 64" fill="none" stroke="#0B1220" stroke-width="40" stroke-linecap="round"/>
  <path d="M68 96c52 0 68 64 120 64" fill="none" stroke="url(#cobalt)" stroke-width="24" stroke-linecap="round"/>
  <path d="M128 112l16 16-16 16-16-16z" fill="#FFFFFF"/>
